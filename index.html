<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Password Challenge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-image-container">
        <!-- صورة التسجيل المدمجة بإطار أنيق ومتناسق -->
        <img src="result.jpg" alt="Password Challenge Result Visual">
      </div>

      <div class="login-form-area">
        <h1>مرحبًا بك في Password Challenge</h1>
        <p class="subtitle">اكتب اسمك بطريقة مميزة خاصة بك</p>
        
        <form id="login-form">
          <div class="form-group">
            <label for="username-input">اسم المستخدم</label>
            <input type="text" id="username-input" class="form-input" placeholder="اسمك المميز هنا..." required autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            ابدأ التحدي الآن
          </button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from './auth.js';

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nameVal = document.getElementById("username-input").value;
      try {
        await auth.registerUser(nameVal);
        window.location.href = "/gamepassword";
      } catch (err) {
        alert(err.message);
      }
    });
  </script>
</body>
</html>
